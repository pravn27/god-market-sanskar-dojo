[project]
name = "sanskar-dojo-api"
version = "0.1.0"
description = "Local FastAPI backend and SQLite store for the Sanskar Dojo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanskar_dojo_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
